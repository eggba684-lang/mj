<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>大鱼吃小鱼</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#062a4a; touch-action:none;
    font-family:-apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #game { display:block; width:100vw; height:100vh; }
  .hud { position:fixed; top:10px; left:12px; right:12px; display:flex; justify-content:space-between;
    align-items:center; color:#fff; font-size:17px; font-weight:700; text-shadow:0 2px 6px rgba(0,0,0,.5);
    pointer-events:none; z-index:5; }
  .hud .lives { letter-spacing:2px; }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; color:#fff; text-align:center; background:rgba(3,25,48,.55); z-index:10; padding:24px; }
  .overlay h1 { font-size:42px; text-shadow:0 3px 12px rgba(0,0,0,.6); }
  .overlay p { font-size:17px; line-height:1.7; opacity:.95; }
  .overlay .small { font-size:14px; opacity:.8; }
  .overlay button { font-size:20px; font-weight:700; color:#06304f; background:#ffd23f; border:none;
    border-radius:999px; padding:14px 42px; cursor:pointer; box-shadow:0 4px 0 #d9a400, 0 8px 20px rgba(0,0,0,.35); }
  .overlay button:active { transform:translateY(3px); box-shadow:0 1px 0 #d9a400; }
  .hidden { display:none !important; }
  #toast { position:fixed; left:50%; top:22%; transform:translateX(-50%); color:#fff; font-size:26px;
    font-weight:800; text-shadow:0 2px 8px rgba(0,0,0,.6); opacity:0; transition:opacity .3s; pointer-events:none; z-index:6; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <div>🐟 分数 <span id="score">0</span></div>
  <div>吃了 <span id="eaten">0</span> 条</div>
  <div class="lives" id="lives">❤️❤️❤️</div>
</div>
<div id="toast"></div>

<div class="overlay" id="startScreen">
  <h1>🐟 大鱼吃小鱼</h1>
  <p>吃掉比你小的鱼，长大变强！<br>躲开比你大的鱼，被咬到会掉一颗心。</p>
  <p class="small">👆 手指拖动 / 🖱️ 鼠标移动来游<br>小鱼是青色的可以吃，红色的比你大、快躲开！</p>
  <p class="small">你的鱼脸是第一张图，大鱼是第二张，小鱼是第三张 🐶</p>
  <button id="startBtn">开始玩</button>
</div>

<div class="overlay hidden" id="overScreen">
  <h1>游戏结束</h1>
  <p>本局分数：<b id="finalScore">0</b><br>一共吃了 <b id="finalEaten">0</b> 条鱼</p>
  <button id="againBtn">再来一局</button>
</div>

  function reset(){
    score = 0; eaten = 0; lives = 3; invuln = 0; frame = 0;
    fishes = []; bubbles = [];
    player.r = 30;
    player.x = player.tx = W / 2;
    player.y = player.ty = H / 2;
    player.dir = 1;
    seaweed = [];
    for (var i = 0; i < 9; i++) seaweed.push({ x: Math.random() * W, h: 40 + Math.random() * 90, sway: Math.random() * 6.28, w: 8 + Math.random() * 10 });
    updateHUD();
  }

  function updateHUD(){
    scoreEl.textContent = score;
    eatenEl.textContent = eaten;
    livesEl.textContent = '❤️'.repeat(Math.max(lives, 0)) || '💔';
  }

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.style.opacity = '1';
    setTimeout(function(){ toastEl.style.opacity = '0'; }, 900);
  }

  function rand(a, b){ return a + Math.random() * (b - a); }
  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

  function spawnFish(){
    // size relative to player: 45% small (edible), 35% similar, 20% big (danger)
    var roll = Math.random(), r;
    if (roll < 0.45) r = rand(10, player.r * 0.8);
    else if (roll < 0.8) r = rand(player.r * 0.8, player.r * 1.15);
    else r = rand(player.r * 1.2, player.r * 2.1);
    r = Math.max(10, Math.min(r, 110));
    var fromLeft = Math.random() < 0.5;
    var speed = rand(0.8, 2.2) * (60 / Math.max(r, 20)); // big fish slower
    fishes.push({
      x: fromLeft ? -r - 20 : W + r + 20,
      y: rand(50, H - 60),
      r: r, vx: (fromLeft ? 1 : -1) * speed,
      hue: r < player.r * 0.9 ? pick([150, 170, 190]) : pick([0, 350, 20]),
      wob: rand(0, 6.28), wobSpeed: rand(0.02, 0.06)
    });
  }

  function drawFish(x, y, r, dir, hue, alpha, face){
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.translate(x, y);
    ctx.scale(dir, 1);
    // tail
    ctx.fillStyle = 'hsl(' + hue + ', 75%, 45%)';
    ctx.beginPath();
    ctx.moveTo(-r * 0.8, 0);
    ctx.lineTo(-r * 1.5, -r * 0.6);
    ctx.lineTo(-r * 1.5, r * 0.6);
    ctx.closePath(); ctx.fill();
    // body
    var g = ctx.createLinearGradient(0, -r, 0, r);
    g.addColorStop(0, 'hsl(' + hue + ', 85%, 62%)');
    g.addColorStop(1, 'hsl(' + hue + ', 80%, 42%)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, 0, r, r * 0.62, 0, 0, Math.PI * 2);
    ctx.fill();
    // belly stripe
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    ctx.beginPath();
    ctx.ellipse(0, r * 0.22, r * 0.8, r * 0.28, 0, 0, Math.PI * 2);
    ctx.fill();
    if (face && face.complete && face.naturalWidth){
      // round face at the front of the fish
      var fr = r * 0.78, fx = r * 0.32;
      ctx.save();
      ctx.beginPath(); ctx.arc(fx, 0, fr, 0, Math.PI * 2); ctx.clip();
      ctx.drawImage(face, fx - fr, -fr, fr * 2, fr * 2);
      ctx.restore();
      ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = Math.max(2, r * 0.05);
      ctx.beginPath(); ctx.arc(fx, 0, fr, 0, Math.PI * 2); ctx.stroke();
    } else {
      // eye
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(r * 0.45, -r * 0.18, r * 0.16, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(r * 0.5, -r * 0.18, r * 0.08, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function step(){
    if (!running) return;
    frame++;
    // move player toward target
    var dx = player.tx - player.x, dy = player.ty - player.y;
    player.x += dx * 0.12; player.y += dy * 0.12;
    if (Math.abs(dx) > 2) player.dir = dx > 0 ? 1 : -1;
    player.x = Math.max(player.r, Math.min(W - player.r, player.x));
    player.y = Math.max(player.r + 30, Math.min(H - player.r, player.y));
    if (invuln > 0) invuln--;

    spawnTimer--;
    if (spawnTimer <= 0){ spawnFish(); spawnTimer = Math.max(28, 70 - Math.floor(score / 200) * 6); }

    // bubbles
    if (frame % 24 === 0) bubbles.push({ x: player.x, y: player.y - player.r, r: rand(2, 6), vy: rand(0.6, 1.4) });
    for (var i = bubbles.length - 1; i >= 0; i--){
      bubbles[i].y -= bubbles[i].vy; bubbles[i].x += Math.sin(frame * 0.05 + i) * 0.4;
      if (bubbles[i].y < -10) bubbles.splice(i, 1);
    }

    // fishes
    for (var j = fishes.length - 1; j >= 0; j--){
      var f = fishes[j];
      f.x += f.vx; f.wob += f.wobSpeed;
      f.y += Math.sin(f.wob) * 0.4;
      if (f.x < -160 || f.x > W + 160){ fishes.splice(j, 1); continue; }
      var d = Math.hypot(f.x - player.x, f.y - player.y);
      if (d < (f.r + player.r) * 0.75){
        if (f.r < player.r * 0.9){
          // eat it
          score += Math.round(f.r);
          eaten++;
          player.r = Math.min(95, player.r + f.r * 0.06);
          fishes.splice(j, 1);
          if (eaten % 10 === 0){ toast('长大啦！🎉'); lives = Math.min(3, lives + 0); }
          updateHUD();
        } else if (invuln <= 0){
          lives--; invuln = 90;
          toast('哎呀！被咬了一口 😖');
          updateHUD();
          // knockback away from the big fish
          player.x += (player.x - f.x) * 0.15;
          player.y += (player.y - f.y) * 0.15;
          if (lives <= 0){ gameOver(); return; }
        }
      }
    }
  }

  function draw(){
    // sea background
    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0a5a8a'); bg.addColorStop(0.6, '#084a73'); bg.addColorStop(1, '#053a5c');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    // light rays
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    for (var k = 0; k < 4; k++){
      var rx = (k * W / 3.5 + (frame * 0.2) % 60) % W;
      ctx.beginPath(); ctx.moveTo(rx, 0); ctx.lineTo(rx + 90, 0); ctx.lineTo(rx + 30, H); ctx.lineTo(rx - 60, H); ctx.closePath(); ctx.fill();
    }
    // sand + seaweed
    ctx.fillStyle = '#c9a86a'; ctx.fillRect(0, H - 26, W, 26);
    ctx.fillStyle = '#b3925a'; ctx.fillRect(0, H - 26, W, 4);
    seaweed.forEach(function(s, idx){
      ctx.strokeStyle = '#2e8b57'; ctx.lineWidth = s.w; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(s.x, H - 24);
      ctx.quadraticCurveTo(s.x + Math.sin(frame * 0.02 + s.sway) * 14, H - 24 - s.h * 0.6, s.x + Math.sin(frame * 0.02 + s.sway) * 22, H - 24 - s.h);
      ctx.stroke();
    });
    // bubbles
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.5;
    bubbles.forEach(function(b){ ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke(); });
    // enemy fish (danger = red, edible = teal/green)
    fishes.forEach(function(f){
      drawFish(f.x, f.y, f.r, f.vx > 0 ? 1 : -1, f.hue, 1, f.r < player.r * 0.9 ? faceSmall : faceBig);
      if (f.r >= player.r * 0.9){
        ctx.fillStyle = 'rgba(255,80,80,.9)';
        ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('!', f.x, f.y - f.r - 8);
      }
    });
    // player (blink while invulnerable)
    var alpha = (invuln > 0 && Math.floor(frame / 6) % 2 === 0) ? 0.4 : 1;
    drawFish(player.x, player.y, player.r, player.dir, player.hue, alpha, facePlayer);
  }

  function loop(){
    step(); draw();
    if (running) requestAnimationFrame(loop);
  }

  function start(){
    reset();
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
    running = true; over = false;
    requestAnimationFrame(loop);
  }

  function gameOver(){
    running = false; over = true;
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalEaten').textContent = eaten;
    overScreen.classList.remove('hidden');
  }

  function setTarget(cx, cy){
    var rect = canvas.getBoundingClientRect();
    player.tx = cx - rect.left; player.ty = cy - rect.top;
  }
  canvas.addEventListener('pointermove', function(e){ setTarget(e.clientX, e.clientY); });
  canvas.addEventListener('pointerdown', function(e){ setTarget(e.clientX, e.clientY); });
  // keyboard fallback
  window.addEventListener('keydown', function(e){
    var s = 26;
    if (e.key === 'ArrowLeft'){ player.tx = player.x - s; player.ty = player.y; }
    if (e.key === 'ArrowRight'){ player.tx = player.x + s; player.ty = player.y; }
    if (e.key === 'ArrowUp'){ player.tx = player.x; player.ty = player.y - s; }
    if (e.key === 'ArrowDown'){ player.tx = player.x; player.ty = player.y + s; }
  });

  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('againBtn').addEventListener('click', start);
  reset(); draw(); // idle scene behind the start screen
})();
</script>
